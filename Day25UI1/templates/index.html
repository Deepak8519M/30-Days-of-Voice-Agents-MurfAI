<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent 🎙️</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="notification" id="notification" style="display: none">
        Audio saved successfully! ✅
      </div>
      <div class="left-sidebar">
        <button id="newChatBtn" class="new-chat-btn">
          New Conversation ✨
        </button>
        <ul id="chatList" class="chat-list"></ul>
      </div>
      <div class="main-content">
        <header>
          <h1>AI Voice Agent - Day 25 🎙️</h1>
          <p>Streaming Audio Data to Client 🚀✨</p>
        </header>
        <div class="transcription-box">
          <h2>Current Conversation 📝</h2>
          <div id="transcription" class="transcription-content">
            <span class="spinner" style="display: none">⏳</span>
          </div>
          <div class="chat-input">
            <input
              type="text"
              id="chatInput"
              placeholder="Type your message..."
            />
            <button id="sendBtn" class="send-btn">Send</button>
            <button id="micBtn" class="mic-btn">🎤</button>
          </div>
        </div>
        <div id="status" class="status">Status: Idle ⏳</div>
        <div id="connectionStatus" class="connection-status">
          Connecting to server... 🔌
        </div>
      </div>
      <div class="right-sidebar">
        <div class="chat-history-box">
          <h2>Conversation History 📜</h2>
          <div id="chatHistory" class="chat-history-content">
            <span class="text">Loading chat history... ⏳</span>
          </div>
        </div>
        <div class="settings-box">
          <h2>Settings ⚙️</h2>
          <div class="settings-content">
            <label for="volumeSlider">Volume:</label>
            <input
              type="range"
              id="volumeSlider"
              min="0"
              max="100"
              value="50"
            />
            <label for="animationSpeed">Animation Speed:</label>
            <select id="animationSpeed">
              <option value="1">Normal</option>
              <option value="1.5">Fast</option>
              <option value="0.5">Slow</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="listeningModal" style="display: none">
      <div class="modal-content">
        <div class="voice-animation">
          <div class="pulse-circle"></div>
          <div class="ripple ripple1"></div>
          <div class="ripple ripple2"></div>
          <div class="ripple ripple3"></div>
        </div>
        <p>Listening...</p>
        <button id="stopListening" class="stop-btn">Stop Listening</button>
      </div>
    </div>
    <script src="/static/index.js"></script>
  </body>
</html>
