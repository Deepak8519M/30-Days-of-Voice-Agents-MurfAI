<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent - Day 17 🎙️</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Voice Agent - Day 17 🎙️</h1>
        <p>Real-time audio streaming & transcription with WebSockets 🚀✨</p>
      </header>
      <div class="controls">
        <button id="recordBtn" class="record-btn">Start Recording 🎵</button>
        <div id="status" class="status">Status: Idle ⏳</div>
      </div>
      <div class="transcription-box">
        <h2>Live Transcription 📜✍️</h2>
        <div id="transcription" class="transcription-content">
          <span class="spinner" style="display: none">⏳</span>
          <span class="text">Waiting for transcription... ⏳</span>
        </div>
      </div>
      <div class="info-box">
        <p>
          Click "Start Recording" to stream audio and see live transcription
          below. Audio saved in <code>uploads/</code>. ✅🔊
        </p>
      </div>
    </div>
    <script>
      class VoiceAgentUI {
        constructor() {
          this.recordBtn = document.getElementById("recordBtn");
          this.status = document.getElementById("status");
          this.transcription = document.getElementById("transcription");
          this.transcriptionText = this.transcription.querySelector(".text");
          this.spinner = this.transcription.querySelector(".spinner");
          this.isRecording = false;
          this.mediaRecorder = null;
          this.websocket = null;

          this.setupWebSocket();
          this.setupEventListeners();
        }

        setupWebSocket() {
          this.websocket = new WebSocket("ws://127.0.0.1:8000/ws");
          this.websocket.onopen = () => {
            this.status.textContent = "Connected to server ✅";
            this.status.classList.remove("error");
            this.status.classList.add("connected");
          };
          this.websocket.onmessage = (event) => {
            const timestamp = new Date().toLocaleTimeString();
            if (event.data.startsWith("Transcription: ")) {
              const text = event.data.replace("Transcription: ", "");
              this.transcriptionText.textContent = text
                ? `[${timestamp}] ${text} 📜`
                : "Waiting for transcription... ⏳";
              this.transcription.classList.add("fade-in");
              this.spinner.style.display = "none";
              setTimeout(
                () => this.transcription.classList.remove("fade-in"),
                500
              );
            } else if (event.data.startsWith("Transcription error: ")) {
              this.transcriptionText.textContent = `[${timestamp}] Error: ${event.data.replace(
                "Transcription error: ",
                ""
              )} ❌`;
              this.transcription.classList.add("error");
              this.spinner.style.display = "none";
            } else if (event.data.startsWith("Invalid WebM chunk")) {
              this.transcriptionText.textContent = `[${timestamp}] Recording... keep speaking ⏳`;
              this.spinner.style.display = "inline";
            } else {
              this.status.textContent = `Server: ${event.data} 📡`;
            }
            this.status.classList.remove("error");
          };
          this.websocket.onerror = () => {
            this.status.textContent = "WebSocket connection failed ❌";
            this.status.classList.add("error");
            this.transcriptionText.textContent = "Disconnected 😞";
            this.spinner.style.display = "none";
          };
          this.websocket.onclose = () => {
            this.status.textContent = "Disconnected from server 😞";
            this.transcriptionText.textContent = "Disconnected 😞";
            this.spinner.style.display = "none";
            this.status.classList.add("error");
          };
        }

        setupEventListeners() {
          this.recordBtn.addEventListener("click", () =>
            this.toggleRecording()
          );

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices
              .getUserMedia({ audio: true })
              .then((stream) => {
                this.mediaRecorder = new MediaRecorder(stream, {
                  mimeType: "audio/webm",
                  audioBitsPerSecond: 128000,
                });
                this.mediaRecorder.ondataavailable = (e) => {
                  if (
                    e.data.size > 0 &&
                    this.websocket.readyState === WebSocket.OPEN
                  ) {
                    this.websocket.send(e.data);
                    this.status.textContent = `Sent chunk: ${e.data.size} bytes 📤`;
                    this.status.classList.remove("error");
                  }
                };
              })
              .catch((err) => {
                this.status.textContent = `Microphone error: ${err.message} 🎤❌`;
                this.status.classList.add("error");
              });
          } else {
            this.status.textContent = "Microphone not supported 🎤🚫";
            this.status.classList.add("error");
          }
        }

        toggleRecording() {
          if (!this.isRecording) {
            if (this.mediaRecorder) {
              this.mediaRecorder.start(2000); // 2s chunks
              this.recordBtn.textContent = "Stop Recording 🛑";
              this.recordBtn.classList.add("recording");
              this.status.textContent = "Recording... 🎙️";
              this.transcriptionText.textContent = "Transcribing... 🎙️";
              this.spinner.style.display = "inline";
              this.transcription.classList.remove("error");
              this.status.classList.remove("error", "connected");
              this.isRecording = true;
            }
          } else {
            if (this.mediaRecorder) {
              this.mediaRecorder.stop();
              this.recordBtn.textContent = "Start Recording 🎵";
              this.recordBtn.classList.remove("recording");
              this.status.textContent = "Status: Idle ⏳";
              this.transcriptionText.textContent =
                "Waiting for transcription... ⏳";
              this.spinner.style.display = "none";
              this.transcription.classList.remove("error");
              this.status.classList.remove("error", "connected");
              this.isRecording = false;
            }
          }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        new VoiceAgentUI();
      });
    </script>
  </body>
</html>
