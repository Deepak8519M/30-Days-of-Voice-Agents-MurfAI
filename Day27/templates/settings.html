<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - AI Voice Agent ⚙️</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/settings.css" />
  </head>
  <body>
    <div class="app settings-app">
      <div class="notification" id="notification" style="display: none">
        API keys submitted successfully! ✅
      </div>
      <div class="settings-container glossy">
        <button id="backBtn" class="back-btn glossy">Back to Main 👈🏻</button>
        <h1>API Configuration ⚙️</h1>
        <form id="apiForm">
          <div class="checkbox-group">
            <label for="enableCustomKeys">
              <input
                type="checkbox"
                id="enableCustomKeys"
                name="enableCustomKeys"
              />
              Enable Custom API Keys
            </label>
          </div>
          <div class="input-group">
            <label for="aai_api_key">AssemblyAI API Key</label>
            <input
              type="password"
              id="aai_api_key"
              name="aai_api_key"
              placeholder="Enter AssemblyAI key"
              disabled
            />
          </div>
          <div class="input-group">
            <label for="gemini_api_key">Gemini API Key</label>
            <input
              type="password"
              id="gemini_api_key"
              name="gemini_api_key"
              placeholder="Enter Gemini key"
              disabled
            />
          </div>
          <div class="input-group">
            <label for="murf_api_key">Murf API Key</label>
            <input
              type="password"
              id="murf_api_key"
              name="murf_api_key"
              placeholder="Enter Murf key"
              disabled
            />
          </div>
          <div class="input-group">
            <label for="tavily_api_key">Tavily API Key</label>
            <input
              type="password"
              id="tavily_api_key"
              name="tavily_api_key"
              placeholder="Enter Tavily key"
              disabled
            />
          </div>
          <div class="input-group">
            <label for="zapier_webhook_url">Zapier Webhook URL</label>
            <input
              type="password"
              id="zapier_webhook_url"
              name="zapier_webhook_url"
              placeholder="Enter Zapier URL"
              disabled
            />
          </div>
          <button type="submit" class="submit-btn glossy" disabled>
            Authenticate and Enable
          </button>
        </form>
      </div>
    </div>
    <script src="/static/settings.js"></script>
  </body>
</html>
