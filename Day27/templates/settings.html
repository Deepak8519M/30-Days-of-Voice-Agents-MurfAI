<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent - Settings ⚙️</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="settings-container">
      <div class="header">
        <button id="backBtn" class="back-btn glossy">← Back to Main</button>
      </div>
      <div class="notification" id="notification" style="display: none"></div>
      <div class="settings-box glossy">
        <h2>API Key Configuration 🔑</h2>
        <form id="apiKeyForm">
          <div class="form-group">
            <label for="aaiApiKey">AssemblyAI API Key</label>
            <input
              type="text"
              id="aaiApiKey"
              name="aaiApiKey"
              placeholder="Enter AssemblyAI API Key"
              class="settings-input"
            />
          </div>
          <div class="form-group">
            <label for="geminiApiKey">Gemini API Key</label>
            <input
              type="text"
              id="geminiApiKey"
              name="geminiApiKey"
              placeholder="Enter Gemini API Key"
              class="settings-input"
            />
          </div>
          <div class="form-group">
            <label for="murfApiKey">Murf API Key</label>
            <input
              type="text"
              id="murfApiKey"
              name="murfApiKey"
              placeholder="Enter Murf API Key"
              class="settings-input"
            />
          </div>
          <div class="form-group">
            <label for="tavilyApiKey">Tavily API Key</label>
            <input
              type="text"
              id="tavilyApiKey"
              name="tavilyApiKey"
              placeholder="Enter Tavily API Key"
              class="settings-input"
            />
          </div>
          <div class="form-group">
            <label for="zapierWebhookUrl">Zapier Webhook URL</label>
            <input
              type="text"
              id="zapierWebhookUrl"
              name="zapierWebhookUrl"
              placeholder="Enter Zapier Webhook URL"
              class="settings-input"
            />
          </div>
          <button type="submit" class="save-btn glossy">Save API Keys</button>
        </form>
      </div>
    </div>
    <script src="/static/settings.js"></script>
  </body>
</html>
