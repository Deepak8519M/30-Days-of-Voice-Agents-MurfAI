<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent - Day 16</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎙️ AI Voice Agent - Day 16</h1>
        <p>Stream your voice in real-time using WebSockets</p>
      </header>

      <div class="controls">
        <button id="recordBtn" class="record-btn">Start Recording</button>
      </div>

      <div id="status" class="status">Status: Idle</div>

      <div class="info-box">
        <p>
          Click <b>Start Recording</b> to capture audio and stream it to the
          server.<br />
          The audio is saved as a <code>.webm</code> file inside the
          <code>uploads/</code> folder.
        </p>
      </div>
    </div>

    <script>
      class VoiceAgentUI {
        constructor() {
          this.recordBtn = document.getElementById("recordBtn");
          this.status = document.getElementById("status");
          this.isRecording = false;
          this.mediaRecorder = null;
          this.websocket = null;

          this.setupWebSocket();
          this.setupEventListeners();
        }

        setupWebSocket() {
          this.websocket = new WebSocket("ws://127.0.0.1:8000/ws");
          this.websocket.onopen = () => {
            this.setStatus("✅ Connected to server", "connected");
          };
          this.websocket.onmessage = (event) => {
            this.setStatus(`📩 ${event.data}`, "connected");
          };
          this.websocket.onerror = () => {
            this.setStatus("❌ WebSocket connection failed", "error");
          };
          this.websocket.onclose = () => {
            this.setStatus("⚠️ Disconnected from server", "error");
          };
        }

        setupEventListeners() {
          this.recordBtn.addEventListener("click", () =>
            this.toggleRecording()
          );

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices
              .getUserMedia({ audio: true })
              .then((stream) => {
                this.mediaRecorder = new MediaRecorder(stream, {
                  mimeType: "audio/webm",
                });
                this.mediaRecorder.ondataavailable = (e) => {
                  if (
                    e.data.size > 0 &&
                    this.websocket.readyState === WebSocket.OPEN
                  ) {
                    this.websocket.send(e.data);
                    this.setStatus(
                      `📤 Sent chunk: ${e.data.size} bytes`,
                      "connected"
                    );
                  }
                };
              })
              .catch((err) => {
                this.setStatus(`🎤 Microphone error: ${err.message}`, "error");
              });
          } else {
            this.setStatus("🎤 Microphone not supported", "error");
          }
        }

        toggleRecording() {
          if (!this.isRecording) {
            if (this.mediaRecorder) {
              this.mediaRecorder.start(1000);
              this.recordBtn.textContent = "⏹ Stop Recording";
              this.recordBtn.classList.add("recording");
              this.setStatus("🎙️ Recording...", "recording");
              this.isRecording = true;
            }
          } else {
            if (this.mediaRecorder) {
              this.mediaRecorder.stop();
              this.recordBtn.textContent = "▶️ Start Recording";
              this.recordBtn.classList.remove("recording");
              this.setStatus("⏸️ Status: Idle", "");
              this.isRecording = false;
            }
          }
        }

        setStatus(message, type) {
          this.status.textContent = message;
          this.status.className = `status ${type}`;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        new VoiceAgentUI();
      });
    </script>
  </body>
</html>
