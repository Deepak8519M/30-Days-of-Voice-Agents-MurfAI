<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent - Day 24 🎙️</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar left-sidebar">
        <h3>Sessions</h3>
        <button class="new-session-btn">New Chat</button>
        <ul id="session-list" class="session-list"></ul>
      </aside>
      <main class="main-content">
        <header>
          <h1>AI Voice Agent - Day 24 🎙️</h1>
          <p>Streaming Audio Data to Client 🚀✨</p>
        </header>
        <div class="controls">
          <button id="startBtn" class="record-btn">
            Start Transcription 🎵
          </button>
          <button
            id="stopBtn"
            class="record-btn stop-btn"
            style="display: none"
          >
            Stop Transcription 🛑
          </button>
          <button id="retryBtn" class="retry-btn" style="display: none">
            Retry Transcription 🔄
          </button>
          <div id="status" class="status">Status: Idle ⏳</div>
        </div>
        <div class="transcription-box">
          <h2>Transcription 📝</h2>
          <div id="transcription" class="transcription-content">
            <span class="spinner" style="display: none">⏳</span>
            <span id="transcriptionText" class="text"
              >Waiting for transcription... ⏳</span
            >
          </div>
        </div>
        <div id="connectionStatus" class="connection-status">
          Connecting to server... 🔌
        </div>
      </main>
      <aside class="sidebar right-sidebar">
        <h2>Chat History 📜</h2>
        <div id="chatHistory" class="chat-history-content">
          <span class="text">Loading chat history... ⏳</span>
        </div>
      </aside>
    </div>
    <script src="/static/index.js"></script>
  </body>
</html>
